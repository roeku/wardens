[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.154"
sim = { path = "../sim" }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3.79"
